name: Import preserved Mastery source snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-original-mastery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-original-mastery
  cancel-in-progress: false

jobs:
  copy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          path: destination
          persist-credentials: true
          submodules: false
      - name: Checkout pinned original source
        uses: actions/checkout@v4
        with:
          repository: MulikShrikantDattatray14/Data-Engineering-Mastry
          ref: bef07ec3e20825eb8e29bd9afc9f6d7ad8c77e3a
          path: original
          persist-credentials: false
      - name: Copy exact source files, verify hashes and commit
        shell: bash
        run: |
          set -euo pipefail
          target="destination/99. Reference Materials/Original Mastery Snapshot"
          mkdir -p "$target"
          if [ -n "$(find "$target" -mindepth 1 -print -quit)" ]; then
            echo "Destination already populated: no destructive overwrite allowed."
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, subprocess, shutil, sys
          src=pathlib.Path("original")
          dst=pathlib.Path("destination/99. Reference Materials/Original Mastery Snapshot")
          files=subprocess.check_output(["git","-C",str(src),"ls-files","-z"]).split(b"\0")
          paths=[p.decode() for p in files if p]
          for rel in paths:
              source=src/rel
              target=dst/rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source,target)
          def blobs(directory):
              entries={}
              for name in paths:
                  f=directory/name
                  result=subprocess.check_output(["git","hash-object",str(f)],text=True).strip()
                  entries[name]=result
              return entries
          original=blobs(src)
          copied=blobs(dst)
          if original!=copied or len(paths)!=552:
              mismatches=[p for p in paths if original.get(p)!=copied.get(p)]
              print(f"FAIL: source={len(paths)}, mismatches={mismatches[:20]}")
              sys.exit(1)
          print(f"PASS: {len(paths)}/{len(paths)} source blobs match exactly")
          PY
          cd destination
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "99. Reference Materials/Original Mastery Snapshot"
          git commit -m "Import all 552 pinned original Mastery source files without alteration"
          git push origin HEAD:main
