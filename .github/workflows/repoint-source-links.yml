name: Repoint canonical source links locally

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repoint-source-links.yml'
      - '01. SQL Mastery/PNP-PROBLEM-INDEX.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: false
      - name: Repoint links to exact archived source files
        run: python3 scripts/repoint_source_links.py
      - name: Commit source link cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Use self-contained original source snapshot for all canonical Markdown links"
            git push origin HEAD:main
          fi
