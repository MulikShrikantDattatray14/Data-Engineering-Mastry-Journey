name: Validate Learning Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify preserved references, indexes and links
        run: python3 scripts/validate_learning_repository.py

      - name: Execute foundation examples and verify SVG diagrams
        run: python3 scripts/check_foundation_examples.py

      - name: Verify newly integrated SQL and Python teaching examples
        run: python3 scripts/verify_learning_examples.py
