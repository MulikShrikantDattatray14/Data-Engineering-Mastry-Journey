name: Validate Learning Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify preserved references, indexes and links
        run: python3 scripts/validate_learning_repository.py

      - name: Check fenced Python examples parse successfully
        run: python3 scripts/check_python_fences.py

      - name: Verify 48 archived mentorship Python snippets against printed source outputs
        run: python3 scripts/check_mentorship_python_pages_05_10.py

      - name: Check 61 archived mentorship Python snippets, PDF pages 11-20
        run: python3 scripts/check_mentorship_python_pages_11_20.py

      - name: Execute 22 archived Python mentorship snippets, PDF pages 21-24
        run: python3 scripts/check_mentorship_python_pages_21_24.py

      - name: Execute 23 archived Python mentorship snippets, PDF pages 25-30
        run: python3 scripts/check_mentorship_python_pages_25_30.py

      - name: Execute all 19 archived Python mentorship snippets, PDF pages 31-34
        run: python3 scripts/check_mentorship_python_pages_31_34.py

      - name: Execute all 26 original advanced Python mentorship examples, PDF pages 35-40
        run: python3 scripts/check_mentorship_python_pages_35_40.py

      - name: Execute 23 DSA mentorship source examples and six synthetic boundaries, PDF pages 41-46
        run: python3 scripts/check_mentorship_python_pages_41_46.py

      - name: Execute 25 DSA mentorship source examples and six synthetic boundary groups, PDF pages 47-52
        run: python3 scripts/check_mentorship_python_pages_47_52.py

      - name: Execute 19 preserved mentorship examples and six synthetic boundaries, PDF pages 53-58
        run: python3 scripts/check_mentorship_python_pages_53_58.py

      - name: Execute 13 archived mentorship coding-pattern examples and six synthetic boundary groups, PDF pages 59-64
        run: |
          python3 -m venv /tmp/mentor-pandas-runtime
          /tmp/mentor-pandas-runtime/bin/pip install --disable-pip-version-check 'pandas==2.3.3'
          /tmp/mentor-pandas-runtime/bin/python scripts/check_mentorship_python_pages_59_64.py
      - name: Check 8 archived mentorship output contracts, one API mock, and five boundary groups, PDF pages 65-68
        run: python3 scripts/check_mentorship_python_pages_65_68.py

      - name: Check 8 original mentorship stdout contracts, 4 descriptive, and 4 synthetic cases, PDF pages 69-72
        run: |
          python3 -m venv /tmp/mentor-pandas-db-runtime
          /tmp/mentor-pandas-db-runtime/bin/pip install --disable-pip-version-check 'pandas==2.3.3' 'numpy>=2.0,<3'
          /tmp/mentor-pandas-db-runtime/bin/python scripts/check_mentorship_python_pages_69_72.py

      - name: Audit original Python mentorship pp.73-74 (2 literal outputs, 2 descriptive contracts, 3 synthetic groups; Spark/Airflow syntax only)
        run: |
          /tmp/mentor-pandas-db-runtime/bin/pip install --disable-pip-version-check 'pytest==8.4.2'
          /tmp/mentor-pandas-db-runtime/bin/python scripts/check_mentorship_python_pages_73_74.py

      - name: Audit 15 preserved mentorship stdout contracts, 22 practice prompts, and four synthetic boundaries, PDF pages 75-80
        run: /tmp/mentor-pandas-db-runtime/bin/python scripts/check_mentorship_python_pages_75_80.py

      - name: Audit preserved Bosscoder Refresher-1 derived notes, 12 pending assignments, and four boundary checks
        run: python3 scripts/check_bosscoder_refresher_01_notes.py

      - name: Audit Bosscoder Refresher-2 archived notes (13 source examples, 4 pending assignments, 5 synthetic boundaries)
        run: python3 scripts/check_bosscoder_refresher_02_notes.py

      - name: Audit Bosscoder Functional Programming Lecture-03 archived examples, pending MCQs and six synthetic boundaries
        run: python3 scripts/check_bosscoder_functional_03_notes.py

      - name: Audit Bosscoder Lecture-04 source-pinned modules/scope/exceptions notes and 11 MCQs
        run: python3 scripts/check_bosscoder_modules_04_notes.py

      - name: Audit Bosscoder Lecture-05 OOP source-pinned public notes, 12 pending MCQs and seven synthetic boundaries
        run: python3 scripts/check_bosscoder_oop_05_notes.py

      - name: Verify 16 source-pinned Bosscoder NumPy public examples, 12 pending MCQs and 7 boundary groups
        run: /tmp/mentor-pandas-db-runtime/bin/python scripts/check_bosscoder_numpy_06_notes.py

      - name: Verify 17 source-pinned Bosscoder Pandas/plots teaching snippets, 10 pending MCQs and seven synthetic groups
        run: |
          /tmp/mentor-pandas-db-runtime/bin/pip install --disable-pip-version-check 'matplotlib==3.10.8' 'seaborn==0.13.2'
          /tmp/mentor-pandas-db-runtime/bin/python scripts/check_bosscoder_pandas_07_notes.py

      - name: Audit 13 immutable Bosscoder Intro SQL answers on SQLite sample and synthetic fixtures
        run: python3 scripts/check_bosscoder_sql_intro_answers.py

      - name: Replay 10 immutable Bosscoder Joins SQL answers and protect 2 pending records
        run: python3 scripts/check_bosscoder_sql_joins_answers.py

      - name: Replay 11 immutable Bosscoder Sorting and Grouping SQL answers on source and synthetic fixtures
        run: python3 scripts/check_bosscoder_sql_grouping_answers.py

      - name: Replay ten immutable Bosscoder Aggregation SQL answers on displayed and synthetic fixtures
        run: python3 scripts/check_bosscoder_sql_aggregation_answers.py

      - name: Replay 10 immutable Bosscoder CTE SQL answers on displayed and synthetic fixtures; protect 2 pending records
        run: python3 scripts/check_bosscoder_sql_cte_answers.py

      - name: Replay six immutable Bosscoder SubQueries source samples and synthetic fixtures (two historical #05 variants)
        run: python3 scripts/check_bosscoder_sql_subqueries_answers.py

      - name: Replay four immutable Bosscoder Recursive CTE sources (8 saved variants; sample and synthetic fixtures)
        run: python3 scripts/check_bosscoder_sql_recursive_cte_answers.py

      - name: Audit six immutable Bosscoder Extra Problems archived SQL answers (6 original samples, 6 synthetic)
        run: python3 scripts/check_bosscoder_sql_extra_answers.py

      - name: Replay 13 immutable Bosscoder SQL string/pattern answers on source and synthetic fixtures
        run: python3 scripts/check_bosscoder_sql_strings_answers.py

      - name: Replay 14 immutable Bosscoder Windowing SQL answers on source-derived and synthetic fixtures
        run: python3 scripts/check_bosscoder_sql_window_answers.py

      - name: Validate SQL semantic edge cases with SQLite
        run: python3 scripts/check_sql_semantic_edge_cases.py

      - name: Verify source-aligned PNP join, grain and pair semantics
        run: python3 scripts/check_pnp_join_cases.py

      - name: Verify PNP grouping semantics on eight synthetic SQLite fixtures
        run: python3 scripts/check_pnp_grouping_cases.py

      - name: Verify six source-aligned PNP aggregation edge cases
        run: python3 scripts/check_pnp_aggregation_cases.py

      - name: Verify PNP CTE and NULL edge cases on nine independent SQLite fixtures
        run: python3 scripts/check_pnp_cte_null_cases.py

      - name: Execute archived learner JOIN answers against independent SQLite fixtures
        run: python3 scripts/check_pnp_archived_join_answers.py

      - name: Execute foundation examples and verify SVG diagrams
        run: python3 scripts/check_foundation_examples.py

      - name: Verify newly integrated SQL and Python teaching examples
        run: python3 scripts/verify_learning_examples.py

      - name: Verify 12 recursive CTE and consecutive-streak source semantics
        run: python3 scripts/check_pnp_recursive_streak_cases.py

      - name: Verify archived SELECT answers and independent string/rating edge cases
        run: python3 scripts/check_pnp_select_strings_extras.py

      - name: Verify synthetic PNP SubQueries edge cases
        run: python3 scripts/check_pnp_subqueries_cases.py

      - name: Validate PNP date and cohort edge cases on source-linked SQLite fixtures
        run: python3 scripts/check_pnp_dates_cases.py

      - name: Validate PNP window-function source inventory and 15 synthetic edge cases
        run: python3 scripts/check_pnp_window_cases.py

      - name: Validate 27 archived quality/analytics sources and 13 synthetic regressions
        run: python3 scripts/check_pnp_quality_analytics_cases.py
      - name: Audit seven immutable non-SQL DE roadmap stubs without crediting unbuilt work
        run: python3 scripts/check_de_subject_boundaries.py
      - name: Replay both archived Bosscoder SQL Basics foundation chapters and four synthetic boundaries
        run: python3 scripts/check_bosscoder_sql_basics_foundation.py

      - name: Replay 16 original Bosscoder Advanced SELECT chapter outputs and six independent boundaries
        run: python3 scripts/check_bosscoder_sql_select_foundation.py

      - name: Replay 19 immutable Bosscoder Joins foundation printed outputs and five synthetic counterexamples
        run: python3 scripts/check_bosscoder_sql_joins_foundation.py

      - name: Replay 13 preserved Bosscoder Sorting Grouping foundation outputs and six synthetic boundaries
        run: python3 scripts/check_bosscoder_sql_grouping_foundation.py

      - name: Verify PNP Q001-Q008 archived key provenance, learner samples and synthetic counterexamples
        run: python3 scripts/check_pnp_first_eight_source_answers.py

      - name: Verify immutable PNP Q009-Q016 source excerpts and bounded key/learner outputs
        run: python3 scripts/check_pnp_09_16_source_answers.py

      - name: Verify PNP Q017-Q024 immutable sources, illustrative SQL, and bounded counterexamples
        run: python3 scripts/check_pnp_17_24_source_answers.py
      - name: Check PNP Q025-Q032 immutable source pins, supplied key, illustrative outputs, and synthetic boundaries
        run: python3 scripts/check_pnp_25_32_source_answers.py

      - name: Audit PNP Q033-Q040 immutable key sources, illustrative outputs and synthetic boundaries
        run: python3 scripts/check_pnp_33_40_source_answers.py

      - name: Audit PNP Q041-Q048 immutable key, eight source illustrations and eight synthetic groups
        run: python3 scripts/check_pnp_41_48_source_answers.py

      - name: Audit PNP Q049-Q056 immutable key, 8 source illustrations, 8 synthetic groups and 2 known divergences
        run: python3 scripts/check_pnp_49_56_source_answers.py
      - name: Audit pinned PNP Q057-Q060 source keys, 4 illustrations, 4 independent boundaries and Q060 name collision
        run: python3 scripts/check_pnp_57_60_source_answers.py

      - name: Audit PNP Q061-Q064 supplied keys, 4 illustrations and 5 synthetic SQLite boundary groups
        run: python3 scripts/check_pnp_61_64_source_answers.py
      - name: Pin PNP Q065-Q072 sources and replay Q070-Q072 keys on six bounded SQLite fixtures
        run: python3 scripts/check_pnp_65_72_source_answers.py

      - name: Replay Q065 Q068 Q069 pinned PostgreSQL keys on seven bounded SQLite fixtures
        run: python3 scripts/check_pnp_65_69_source_answers.py

      - name: Audit Q066 Q067 pinned source percentiles, 2 original illustrations and 4 synthetic groups
        run: python3 scripts/check_pnp_66_67_source_answers.py

      - name: Audit Q073 Q076 archived key queries, 4 returned-row illustrations, 4 synthetic groups and known Q076 missing-month discrepancy
        run: python3 scripts/check_pnp_73_76_source_answers.py

      - name: Audit pinned PNP Q077-Q080 reference key, 4 illustrations, 4 boundary groups and 2 conditional cases
        run: python3 scripts/check_pnp_77_80_source_answers.py
      - name: Inspect Q081-Q088 pinned sources and replay Q081 Q082 Q085 Q086 keys (bounded; Q086 ordering discrepancy)
        run: python3 scripts/check_pnp_81_88_source_answers.py

      - name: Replay Q087 and Q088 pinned supplied keys on 2 original examples, synthetic edges and nine-rule empty-data discrepancy
        run: python3 scripts/check_pnp_87_88_source_answers.py

      - name: Replay Q083 Q084 source-pinned supplied keys, 2 illustrations, 2 boundaries and 2 conditional contradictions
        run: python3 scripts/check_pnp_83_84_source_answers.py

      - name: Replay PNP Q092/Q094 exact source keys (2 source examples, 2 synthetic groups and 2 conditional diagnostics)
        run: python3 scripts/check_pnp_92_94_source_answers.py
      - name: Replay exact archived PNP Q097-Q098 keys (2 original illustrations, 2 synthetic groups, 2 empty boundaries)
        run: python3 scripts/check_pnp_97_98_source_answers.py

      - name: Audit source-pinned Q090 unpivot and Q095 category sales keys on source and synthetic fixtures
        run: python3 scripts/check_pnp_90_95_source_answers.py

      - name: Audit pinned PNP Q096 slow vs supplied sargable report on four SQLite fixtures and plan evidence
        run: python3 scripts/check_pnp_96_source_answers.py

      - name: Verify all 205 actual PNP P/A/X source IDs and 100 supplied-key sections
        run: python3 scripts/check_pnp_source_inventory.py

      - name: Audit 10 source-pinned Advanced SQL questions; replay archived A004/A005 answers on 8 SQLite fixtures
        run: python3 scripts/check_pnp_advanced_01_10_sources.py

      - name: Audit ten source-pinned A011-A020 questions and eight saved A012/A014 SQLite fixture groups
        run: python3 scripts/check_pnp_advanced_11_20_sources.py

      - name: Check source-pinned A021-A030 prompts and 20 auditor-authored SQLite principle fixtures (not official answers)
        run: python3 scripts/check_pnp_advanced_21_30_sources.py

      - name: Inspect pinned A031-A040; check 20 bounded SQLite groups, including A035 original NULL-poison query
        run: python3 scripts/check_pnp_advanced_31_40_sources.py

      - name: Audit source-pinned A041-A050; inspect 10 statements and assert 13 reviewer SQLite fixtures
        run: python3 scripts/check_pnp_advanced_41_50_sources.py

      - name: Audit source-pinned A051-A060 and 20 synthetic window/rank/date fixtures
        run: python3 scripts/check_pnp_advanced_51_60_sources.py
      - name: Audit source-pinned A061-A070 and 20 calendar/window/peer reviewer SQLite fixture groups
        run: python3 scripts/check_pnp_advanced_61_70_sources.py
      - name: Audit source-pinned A071-A080, ten original statements and twenty reviewer SQLite cases
        run: python3 scripts/check_pnp_advanced_71_80_sources.py
