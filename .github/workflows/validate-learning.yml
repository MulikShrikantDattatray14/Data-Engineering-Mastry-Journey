  native_postgres_pnp_84_90:
    name: Native PostgreSQL 16 PNP Q084/Q089/Q090/Q091/Q093/Q095/Q096/Q097/Q098/Q099/Q100 partial audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Replay original SQL Q084 ROLLUP and Q090 LATERAL on disposable native PostgreSQL 16 tables
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: audit
          PGUSER: audit
          PGPASSWORD: audit
        run: |
          python3 -m venv /tmp/pnp-native-pg
          /tmp/pnp-native-pg/bin/python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'
          /tmp/pnp-native-pg/bin/python scripts/check_pnp_84_90_native_postgres.py
      - name: Forensic native PostgreSQL 16 Q089 original incremental-load key and guarded syntax control
