<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Customer and orders relationship</title><desc id="d">Asha, customer 1, has two orders 101 and 102. Ravi, customer 2, has order 103. CustomerID is a primary key in Customers and a foreign key in Orders.</desc><rect width="900" height="300" rx="16" fill="#111827"/><text x="28" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#f8fafc">One customer can have many orders</text><rect x="24" y="55" width="280" height="200" rx="13" fill="#17354c" stroke="#34d399" stroke-width="2"/><text x="43" y="90" fill="#86efac" font-family="Arial" font-size="22">Customers</text><text x="43" y="122" fill="#cbd5e1" font-family="Arial" font-size="16">CustomerID (PK)  Name</text><text x="43" y="165" fill="#f8fafc" font-family="Arial" font-size="21">1      Asha</text><text x="43" y="220" fill="#f8fafc" font-family="Arial" font-size="21">2      Ravi</text><path d="M300 157 C375 157 390 140 475 140 M300 165 C377 165 405 197 475 197 M300 219 C370 219 397 247 475 247" stroke="#34d399" stroke-width="3" fill="none"/><rect x="475" y="55" width="402" height="200" rx="13" fill="#17354c" stroke="#38bdf8" stroke-width="2"/><text x="494" y="90" fill="#7dd3fc" font-family="Arial" font-size="22">Orders</text><text x="494" y="122" fill="#cbd5e1" font-family="Arial" font-size="16">OrderID  CustomerID (FK)  Amount</text><text x="494" y="158" fill="#f8fafc" font-family="Arial" font-size="19">101           1                    300</text><text x="494" y="211" fill="#f8fafc" font-family="Arial" font-size="19">102           1                    700</text><text x="494" y="254" fill="#f8fafc" font-family="Arial" font-size="19">103           2                    450</text><text x="27" y="281" fill="#94a3b8" font-family="Arial" font-size="14">PK = Primary Key  •  FK = Foreign Key  •  Each Orders row represents one order</text></svg>