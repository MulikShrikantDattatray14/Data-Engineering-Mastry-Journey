<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" width="1080" height="310" role="img" aria-labelledby="t d">
<title id="t">WHERE then GROUP BY then HAVING</title><desc id="d">Four orders become three paid orders, then two customer groups, then one qualifying customer with total 400</desc><rect width="1080" height="310" rx="20" fill="#0e1728"/>
<text x="30" y="42" font-family="Arial,sans-serif" fill="#fff" font-size="23" font-weight="700">Why WHERE and HAVING are different</text>
<rect x="22" y="64" width="240" height="192" rx="13" fill="#1c2a40" stroke="#536781" stroke-width="1.5"/><text x="38" y="93" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Orders</text><text x="38" y="118" fill="#93c5fd" font-family="Arial,sans-serif" font-size="15">4 rows</text><text x="38" y="148" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">1: 10 → 100</text><text x="38" y="174" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">2: 20 → 50</text><text x="38" y="200" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">3: 10 → 300</text><text x="38" y="226" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">4: 20 → 200*</text><text x="268" y="174" fill="#60a5fa" font-family="Arial,sans-serif" font-size="26">➜</text></rect><rect x="297" y="64" width="240" height="192" rx="13" fill="#1c2a40" stroke="#536781" stroke-width="1.5"/><text x="313" y="93" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="bold">WHERE paid</text><text x="313" y="118" fill="#93c5fd" font-family="Arial,sans-serif" font-size="15">3 rows</text><text x="313" y="148" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">1: 10 → 100</text><text x="313" y="174" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">2: 20 → 50</text><text x="313" y="200" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">3: 10 → 300</text><text x="313" y="226" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">*pending removed</text><text x="543" y="174" fill="#60a5fa" font-family="Arial,sans-serif" font-size="26">➜</text></rect><rect x="572" y="64" width="240" height="192" rx="13" fill="#1c2a40" stroke="#536781" stroke-width="1.5"/><text x="588" y="93" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="bold">GROUP BY</text><text x="588" y="118" fill="#93c5fd" font-family="Arial,sans-serif" font-size="15">2 totals</text><text x="588" y="148" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">10 → 400</text><text x="588" y="174" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">20 → 50</text><text x="588" y="200" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15"></text><text x="588" y="226" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15"></text><text x="818" y="174" fill="#60a5fa" font-family="Arial,sans-serif" font-size="26">➜</text></rect><rect x="847" y="64" width="240" height="192" rx="13" fill="#123c32" stroke="#22c55e" stroke-width="1.5"/><text x="863" y="93" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="bold">HAVING ≥ 100</text><text x="863" y="118" fill="#93c5fd" font-family="Arial,sans-serif" font-size="15">1 result</text><text x="863" y="148" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">10 → 400</text><text x="863" y="174" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">20 removed</text><text x="863" y="200" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15"></text><text x="863" y="226" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15"></text></rect>
<text x="30" y="290" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">*The pending order is excluded before the customer totals are calculated.</text>
</svg>